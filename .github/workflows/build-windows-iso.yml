name: Build Windows ISO with Autounattend

# Builds a custom Windows ISO by injecting autounattend.xml into a stock ISO
# and optionally uploads it to a SMB network share.
#
# Required secrets for SMB upload (optional – skip if not needed):
#   SMB_HOST     – hostname or IP of the SMB server (e.g. 192.168.1.10)
#   SMB_SHARE    – share name (e.g. isos)
#   SMB_USER     – SMB username
#   SMB_PASSWORD – SMB password
#   SMB_DIR      – (optional) subdirectory inside the share (e.g. windows)

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: 'Direct URL to the Windows ISO file'
        required: true
        type: string
      output_name:
        description: 'Output ISO filename without extension'
        required: false
        default: 'Windows-Unattended'
        type: string

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xorriso smbclient

      - name: Download Windows ISO
        run: |
          echo "Downloading Windows ISO from: ${{ github.event.inputs.windows_iso_url }}"
          curl -fSL --retry 3 --retry-delay 5 \
            -o windows_original.iso \
            "${{ github.event.inputs.windows_iso_url }}"
          echo "Download complete: $(du -h windows_original.iso | cut -f1)"

      - name: Extract ISO contents
        run: |
          mkdir -p iso_contents
          xorriso -osirrox on -indev windows_original.iso -extract / iso_contents/
          echo "ISO extracted to iso_contents/"

      - name: Inject autounattend.xml
        run: |
          cp autounattend.xml iso_contents/autounattend.xml
          echo "autounattend.xml placed at ISO root"

      - name: Rebuild bootable ISO
        run: |
          OUTPUT="${{ github.event.inputs.output_name }}.iso"

          # Retrieve El Torito boot parameters from the original ISO so the
          # new image boots exactly the same way (BIOS + UEFI).
          BOOT_ARGS=$(xorriso -indev windows_original.iso \
            -report_el_torito as_mkisofs 2>/dev/null | tail -n +2)

          eval xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -udf \
            $BOOT_ARGS \
            -o "$OUTPUT" \
            iso_contents/

          echo "ISO built: $(du -h "$OUTPUT" | cut -f1)"

      - name: Upload ISO as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: ${{ github.event.inputs.output_name }}.iso
          retention-days: 7

      - name: Upload ISO to SMB network share
        env:
          SMB_HOST: ${{ secrets.SMB_HOST }}
          SMB_SHARE: ${{ secrets.SMB_SHARE }}
          SMB_USER: ${{ secrets.SMB_USER }}
          SMB_PASSWORD: ${{ secrets.SMB_PASSWORD }}
          SMB_DIR: ${{ secrets.SMB_DIR }}
        run: |
          if [ -z "$SMB_HOST" ]; then
            echo "SMB_HOST secret not configured – skipping network share upload."
            exit 0
          fi

          OUTPUT="${{ github.event.inputs.output_name }}.iso"

          # Pass the password via the PASSWD env variable so it does not
          # appear in the process listing.
          export PASSWD="$SMB_PASSWORD"

          if [ -n "$SMB_DIR" ]; then
            REMOTE="$SMB_DIR/$OUTPUT"
            # Create the directory first; ignore failure if it already exists.
            smbclient "//$SMB_HOST/$SMB_SHARE" -U "$SMB_USER" \
              -c "mkdir \"$SMB_DIR\"" 2>/dev/null || true
            SMB_COMMANDS="put $OUTPUT \"$REMOTE\""
          else
            REMOTE="$OUTPUT"
            SMB_COMMANDS="put $OUTPUT $REMOTE"
          fi

          echo "Uploading $OUTPUT to //$SMB_HOST/$SMB_SHARE/$REMOTE"
          smbclient "//$SMB_HOST/$SMB_SHARE" -U "$SMB_USER" \
            -c "$SMB_COMMANDS"
          echo "Upload complete."
